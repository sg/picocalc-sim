# Builds the Linux and Windows binaries of a branch, boots the latest pcsh, picocalc_lua,
# picocalc-z80 and ftpserver releases on the Pico 2, Pico 2 W, Pimoroni Plus 2 W, Pico and Pico W,
# transfers files to and from ftpserver over the emulated WiFi, runs the TrustZone test, enumerates
# the boot ROMs' USB boot, talks to a USB serial port, copies a UF2 onto a boot ROM's drive and
# exports the device over USB/IP. The Windows build is tested under Wine. It runs only when started
# by hand, since release.yml does the same for every version tag.

name: Build

on:
  workflow_dispatch:

env:
  # the RP2040 boot ROM the Pico and Pico W tests need, fetched for the run
  PICOCALC_SIM_ROM: rom/b2.elf

jobs:
  linux:
    runs-on: docker
    container:
      # the Pico SDK builder from picocalc-z80's ci/builder; picocalc-sim uses only its compiler and
      # cmake, and ci/build-linux.sh adds the SDL headers it lacks
      image: picocalc-builder:2.3.1
    steps:
      - name: Check out
        run: |
          git init --quiet src
          git -C src fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C src checkout --quiet FETCH_HEAD
          git -C src log -1 --oneline

      - name: Build
        run: src/ci/build-linux.sh src build

      - name: Fetch the RP2040 boot ROM
        run: src/ci/fetch-rp2040-rom.sh "$PICOCALC_SIM_ROM"

      - name: Boot the latest firmware releases
        run: |
          src/ci/fetch-firmware.sh "$GITHUB_API_URL" "${GITHUB_REPOSITORY%%/*}" fw
          src/ci/boot-test.sh build/picocalc-sim fw/*.uf2

      - name: Restart each firmware mid-boot
        run: src/ci/restart-test.sh build/picocalc-sim fw/*.uf2

      - name: Serve FTP over the emulated WiFi
        run: src/ci/wifi-test.sh build/picocalc-sim build/tools/mkcard/picocalc-sim-mkcard fw/picocalc-ftpserver-*.uf2

      - name: Check the security extension with the TrustZone test
        run: src/ci/trustzone-test.sh build/picocalc-sim src/tests/trustzone/trustzone.uf2

      - name: Enumerate the RP2040 ROM's USB boot on the emulated cable
        run: src/ci/usb-test.sh build/picocalc-sim pico 2e8a:0003

      - name: Talk to a USB serial port over the USB console
        run: |
          src/ci/usbserial-test.sh build/picocalc-sim src/tests/usbserial/usbserial-pico2.uf2
          src/ci/usbserial-test.sh build/picocalc-sim src/tests/usbserial/usbserial-pico.uf2

      - name: Copy a UF2 onto the RP2040 ROM's drive
        run: src/ci/usbdrive-test.sh build/picocalc-sim pico src/tests/usbserial/usbserial-pico.uf2 2e8a:000a

      - name: Export the USB device over USB/IP
        run: |
          src/ci/usbip-test.sh build/picocalc-sim pico2 serial src/tests/usbserial/usbserial-pico2.uf2
          src/ci/usbip-test.sh build/picocalc-sim pico serial src/tests/usbserial/usbserial-pico.uf2
          src/ci/usbip-test.sh build/picocalc-sim pico drive src/tests/usbserial/usbserial-pico.uf2 2e8a:000a

      - name: Boot, restart and enumerate the RP2350 firmware and USB boot on Raspberry Pi's A2 and A4 ROMs
        run: |
          (cd src/roms/rp2350 && sha256sum -c SHA256SUMS)
          for rev in A2 A4; do
            export PICOCALC_SIM_RP2350_ROM=src/roms/rp2350/$rev/bootrom-combined.bin
            src/ci/boot-test.sh build/picocalc-sim fw/*-pico2-*.uf2 fw/*-pico2w-*.uf2 fw/*-pim2w-*.uf2
            src/ci/restart-test.sh build/picocalc-sim fw/*-pico2-*.uf2 fw/*-pico2w-*.uf2 fw/*-pim2w-*.uf2
            src/ci/trustzone-test.sh build/picocalc-sim src/tests/trustzone/trustzone.uf2
            src/ci/usb-test.sh build/picocalc-sim pico2 2e8a:000f
            src/ci/usbserial-test.sh build/picocalc-sim src/tests/usbserial/usbserial-pico2.uf2
            src/ci/usbdrive-test.sh build/picocalc-sim pico2 src/tests/usbserial/usbserial-pico2.uf2 2e8a:0009
            src/ci/usbip-test.sh build/picocalc-sim pico2 drive src/tests/usbserial/usbserial-pico2.uf2 2e8a:0009
          done

  windows:
    runs-on: docker
    container:
      # the same builder; ci/build-windows.sh adds MinGW-w64 and ci/wine-wrap.sh adds Wine
      image: picocalc-builder:2.3.1
    steps:
      - name: Check out
        run: |
          git init --quiet src
          git -C src fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C src checkout --quiet FETCH_HEAD
          git -C src log -1 --oneline

      - name: Build
        run: src/ci/build-windows.sh src build-win

      - name: Set up Wine
        run: src/ci/wine-wrap.sh build-win

      - name: Fetch the RP2040 boot ROM
        run: src/ci/fetch-rp2040-rom.sh "$PICOCALC_SIM_ROM"

      - name: Boot the latest firmware releases
        run: |
          src/ci/fetch-firmware.sh "$GITHUB_API_URL" "${GITHUB_REPOSITORY%%/*}" fw
          src/ci/boot-test.sh build-win/picocalc-sim-wine fw/*.uf2

      - name: Restart each firmware mid-boot
        run: src/ci/restart-test.sh build-win/picocalc-sim-wine fw/*.uf2

      - name: Serve FTP over the emulated WiFi
        run: src/ci/wifi-test.sh build-win/picocalc-sim-wine build-win/picocalc-sim-mkcard-wine fw/picocalc-ftpserver-*.uf2

      - name: Check the security extension with the TrustZone test
        run: src/ci/trustzone-test.sh build-win/picocalc-sim-wine src/tests/trustzone/trustzone.uf2

      - name: Enumerate the RP2040 ROM's USB boot on the emulated cable
        run: src/ci/usb-test.sh build-win/picocalc-sim-wine pico 2e8a:0003

      - name: Talk to a USB serial port over the USB console
        run: src/ci/usbserial-test.sh build-win/picocalc-sim-wine src/tests/usbserial/usbserial-pico2.uf2

      - name: Copy a UF2 onto the RP2040 ROM's drive
        run: src/ci/usbdrive-test.sh build-win/picocalc-sim-wine pico src/tests/usbserial/usbserial-pico.uf2 2e8a:000a

      - name: Export the USB device over USB/IP
        run: src/ci/usbip-test.sh build-win/picocalc-sim-wine pico2 serial src/tests/usbserial/usbserial-pico2.uf2
