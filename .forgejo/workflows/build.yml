# Builds the Linux and Windows binaries of a branch, boots the latest pcsh, picocalc_lua,
# picocalc-z80 and ftpserver releases on the Pico 2, Pico 2 W, Pimoroni Plus 2 W, Pico and
# Pico W, and transfers files to and from ftpserver over the emulated WiFi. The Windows build is
# tested under Wine. It runs only when started by hand, since release.yml does the same for every
# version tag.
name: Build

on:
  workflow_dispatch:

env:
  # the RP2040 boot ROM the Pico and Pico W tests need, fetched for the run
  PCSIM_ROM: rom/b2.elf

jobs:
  linux:
    runs-on: docker
    container:
      # the Pico SDK builder from picocalc-z80's ci/builder; pcsim uses only its compiler and
      # cmake, and ci/build-linux.sh adds the SDL headers it lacks
      image: picocalc-builder:2.3.1
    steps:
      - name: Check out
        run: |
          git init --quiet src
          git -C src fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C src checkout --quiet FETCH_HEAD
          git -C src log -1 --oneline

      - name: Build
        run: src/ci/build-linux.sh src build

      - name: Fetch the RP2040 boot ROM
        run: src/ci/fetch-rp2040-rom.sh "$PCSIM_ROM"

      - name: Boot the latest firmware releases
        run: |
          src/ci/fetch-firmware.sh "$GITHUB_API_URL" "${GITHUB_REPOSITORY%%/*}" fw
          src/ci/boot-test.sh build/pcsim fw/*.uf2

      - name: Serve FTP over the emulated WiFi
        run: src/ci/wifi-test.sh build/pcsim build/tools/mkcard/pcsim-mkcard fw/picocalc-ftpserver-*.uf2

  windows:
    runs-on: docker
    container:
      # the same builder; ci/build-windows.sh adds MinGW-w64 and ci/wine-wrap.sh adds Wine
      image: picocalc-builder:2.3.1
    steps:
      - name: Check out
        run: |
          git init --quiet src
          git -C src fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C src checkout --quiet FETCH_HEAD
          git -C src log -1 --oneline

      - name: Build
        run: src/ci/build-windows.sh src build-win

      - name: Set up Wine
        run: src/ci/wine-wrap.sh build-win

      - name: Fetch the RP2040 boot ROM
        run: src/ci/fetch-rp2040-rom.sh "$PCSIM_ROM"

      - name: Boot the latest firmware releases
        run: |
          src/ci/fetch-firmware.sh "$GITHUB_API_URL" "${GITHUB_REPOSITORY%%/*}" fw
          src/ci/boot-test.sh build-win/pcsim-wine fw/*.uf2

      - name: Serve FTP over the emulated WiFi
        run: src/ci/wifi-test.sh build-win/pcsim-wine build-win/pcsim-mkcard-wine fw/picocalc-ftpserver-*.uf2
